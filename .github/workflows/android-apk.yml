name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'js/**'
      - 'css/**'
      - 'pages/**'
      - 'data/**'
      - 'icons/**'
      - 'index.html'
      - 'app.js'
      - 'sw.js'
      - 'version.json'
      - 'manifest.json'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-www.js'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install deps
        run: npm ci

      - name: Sync Android version
        run: node scripts/sync-android-version.js

      - name: Build www + Cap sync
        run: npm run cap:sync

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Read app version
        id: ver
        run: echo "version=$(node -p "require('./version.json').version")" >> "$GITHUB_OUTPUT"

      - name: Stage APK
        id: stage
        run: |
          SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$SRC"
          VER="${{ steps.ver.outputs.version }}"
          DEST="MyGym-${VER}-debug.apk"
          LATEST="MyGym-latest-debug.apk"
          cp "$SRC" "$DEST"
          cp "$SRC" "$LATEST"
          echo "apk=$DEST" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST" "$LATEST"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mygym-android-apk
          path: |
            ${{ steps.stage.outputs.apk }}
            ${{ steps.stage.outputs.latest }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ steps.ver.outputs.version }}-${{ github.run_number }}
          name: MyGym Android v${{ steps.ver.outputs.version }} (${{ github.run_number }})
          body: |
            Debug APK для установки на телефон.

            **Версия:** ${{ steps.ver.outputs.version }}

            1. Скачай `MyGym-latest-debug.apk` (стабильная ссылка) или `MyGym-${{ steps.ver.outputs.version }}-debug.apk`
            2. На Android разреши установку из неизвестных источников
            3. Открой файл и установи поверх старой версии

            **Важно:** если раньше ставил APK, собранный вручную на другом ПК, один раз удали старое приложение и поставь этот билд. Дальше все обновления из GitHub Actions будут ставиться поверх без удаления.

            Прямая ссылка: https://github.com/k4rtosh/mygym/releases/latest/download/MyGym-latest-debug.apk

            Web: https://k4rtosh.github.io/mygym/
          files: |
            ${{ steps.stage.outputs.apk }}
            ${{ steps.stage.outputs.latest }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

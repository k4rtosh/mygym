<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0c1018">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="icons/icon-16x16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="icons/icon-180x180.png">
  <title>MyGym - Дневник тренировок</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>
  <nav id="shell-nav" class="bottom-nav is-hidden" aria-label="Основное меню">
    <button type="button" class="nav-item" data-nav="home"><i class="bi bi-house"></i><span>Главная</span></button>
    <button type="button" class="nav-item" data-nav="calendar"><i class="bi bi-calendar3"></i><span>Календарь</span></button>
    <button type="button" class="nav-item" data-nav="templates"><i class="bi bi-collection"></i><span>Шаблоны</span></button>
    <button type="button" class="nav-item" data-nav="progress"><i class="bi bi-graph-up"></i><span>Прогресс</span></button>
    <button type="button" class="nav-item" data-nav="profile"><i class="bi bi-person"></i><span>Профиль</span></button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/analytics/profileMetrics.js"></script>
  <script src="js/analytics/bodyWeight.js"></script>
  <script src="js/analytics/adherence.js"></script>
  <script src="js/analytics/insights.js"></script>
  <script src="js/analytics/coachGoal.js"></script>
  <script src="js/analytics/coach.js"></script>
  <script src="js/demoMode.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/onboarding.js"></script>
  <script src="js/router.js"></script>
  <script src="js/gestures.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/workout.js"></script>
  <script src="js/history.js"></script>
  <script src="js/exercises.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/demoData.js"></script>
  <script src="js/updateCheck.js"></script>
  <script src="app.js"></script>

  <script>
    document.getElementById('shell-nav')?.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-nav]');
      if (!btn || !window.Router) return;
      // Tabs replace stack — no swipe between bottom-nav destinations.
      Router.navigate(btn.dataset.nav, {}, { replace: true });
    });
    (function registerServiceWorker() {
      const cfg = window.MYGYM_CONFIG || {};
      if (cfg.IS_NATIVE) return;
      if (!('serviceWorker' in navigator)) return;
      if (sessionStorage.getItem('mygym_skip_sw') === '1') {
        sessionStorage.removeItem('mygym_skip_sw');
        return;
      }
      const swUrl = (cfg.BASE_PATH || '') + '/sw.js';
      window.addEventListener('load', () => {
        navigator.serviceWorker.register(swUrl, { updateViaCache: 'none' })
          .then((registration) => registration.update())
          .catch((err) => {
            console.log('SW register skip:', err);
          });
      });
    })();
  </script>
</body>
</html>

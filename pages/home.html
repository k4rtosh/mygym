<div class="app-header home-hero fade-in">
  <div class="brand-mark">MyGym</div>
  <h4 id="user-greeting">Привет!</h4>
  <p class="text-muted mb-0">Готов к тренировке?</p>
</div>

<div class="container fade-in">
  <div id="active-workout-banner"></div>

  <section class="home-today mb-4" aria-label="Сегодня">
    <div id="today-plan"></div>
    <button class="start-workout-btn mb-0" id="start-workout-btn">
      <i class="bi bi-lightning-charge-fill"></i> Начать тренировку
    </button>
  </section>

  <div class="row g-2 mb-4 home-stats">
    <div class="col-4">
      <div class="card stat-card">
        <div class="stat-value" id="stat-today">0</div>
        <div class="stat-label">Сегодня</div>
      </div>
    </div>
    <div class="col-4">
      <div class="card stat-card">
        <div class="stat-value" id="stat-week">0</div>
        <div class="stat-label">Неделя</div>
      </div>
    </div>
    <div class="col-4">
      <div class="card stat-card">
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-label">Всего</div>
      </div>
    </div>
  </div>

  <button class="btn btn-ghost w-100 mb-4" onclick="Router.navigate('history')">
    <i class="bi bi-clock-history"></i> История тренировок
  </button>

  <div id="last-workout-info" class="fade-in">
    <div class="alert alert-secondary mb-0">Нет завершённых тренировок</div>
  </div>
</div>

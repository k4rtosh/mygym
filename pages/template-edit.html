<div class="app-header fade-in">
    <div class="d-flex justify-content-between align-items-center">
        <button class="btn btn-link text-white" onclick="Router.navigate('templates')">
            <i class="bi bi-arrow-left"></i>
        </button>
        <h4 class="mb-0">Редактор шаблона</h4>
        <button class="btn btn-primary btn-sm" id="save-template-btn">
            <i class="bi bi-check-lg"></i> Сохранить
        </button>
    </div>
</div>

<div class="container fade-in">
    <div class="card mb-3">
        <div class="card-body">
            <label class="form-label">Название шаблона</label>
            <input type="text" class="form-control" id="template-name" placeholder="Например: День груди">
        </div>
    </div>
    
    <div id="template-exercises">
        <!-- Упражнения шаблона -->
    </div>
    
    <button class="btn btn-outline-primary w-100 mt-3" onclick="Templates.addExercise()">
        <i class="bi bi-plus-circle"></i> Добавить упражнение
    </button>
</div>

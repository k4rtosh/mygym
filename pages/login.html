<div class="login-container">
    <div class="container">
        <div class="text-center mb-5 fade-in">
            <h1 class="display-4 fw-bold" style="color: var(--primary-color);">MyGym</h1>
            <p class="lead">Дневник тренировок</p>
        </div>
        
        <div class="card fade-in">
            <div class="card-body p-4">
                <h5 class="card-title text-center mb-4">Выберите пользователя</h5>
                
                <div class="row" id="user-list">
                    <!-- Пользователи будут загружены динамически -->
                </div>
                
                <div id="pin-section" class="mt-3" style="display: none;">
                    <label class="form-label">Введите PIN-код:</label>
                    <div class="input-group">
                        <input type="password" 
                               id="pin-input" 
                               class="form-control form-control-lg" 
                               placeholder="****"
                               maxlength="4"
                               inputmode="numeric"
                               pattern="[0-9]*">
                        <button class="btn btn-primary" id="pin-submit">
                            <i class="bi bi-arrow-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="text-center text-muted mt-4">
            <small>Версия 1.0.0</small>
        </div>
    </div>
</div>

<script>
// Показываем секцию PIN при выборе пользователя
const observer = new MutationObserver(() => {
    const userList = document.getElementById('user-list');
    if (userList && userList.children.length > 0) {
        // Добавляем обработчики на кнопки пользователей
        document.querySelectorAll('.user-select-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.getElementById('pin-section').style.display = 'block';
            });
        });
        observer.disconnect();
    }
});
observer.observe(document.getElementById('app'), { childList: true, subtree: true });
</script>

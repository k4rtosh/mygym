<div class="login-container">
  <div class="container" style="max-width: 420px;">
    <div class="text-center mb-4 fade-in">
      <h1 class="display-5 fw-bold" style="color: var(--primary-color);">MyGym</h1>
      <p class="lead">Дневник тренировок в облаке</p>
    </div>

    <div class="card fade-in">
      <div class="card-body p-4">
        <div class="btn-group w-100 mb-4" role="group">
          <button type="button" class="btn btn-outline-light active" id="tab-login">Вход</button>
          <button type="button" class="btn btn-outline-light" id="tab-signup">Регистрация</button>
        </div>

        <div id="login-form">
          <div class="mb-3">
            <label class="form-label" for="login-email">Email</label>
            <input type="email" class="form-control form-control-lg" id="login-email" autocomplete="username">
          </div>
          <div class="mb-3">
            <label class="form-label" for="login-password">Пароль</label>
            <input type="password" class="form-control form-control-lg" id="login-password" autocomplete="current-password">
          </div>
          <button class="btn btn-primary w-100 btn-lg" id="login-submit">Войти</button>
          <div class="text-center mt-3">
            <div class="d-flex align-items-center gap-2 mb-2"><hr class="flex-grow-1 border-secondary"><span class="text-muted small">или</span><hr class="flex-grow-1 border-secondary"></div>
            <button class="btn btn-outline-warning w-100" id="demo-login-btn"><i class="bi bi-lightning-fill"></i> Войти в демо</button>
            <div class="text-muted mt-2" style="font-size:0.75rem;">Без регистрации · данные хранятся локально</div>
          </div>
        </div>

        <div id="signup-form" class="d-none">
          <div class="mb-3">
            <label class="form-label" for="signup-name">Имя</label>
            <input type="text" class="form-control form-control-lg" id="signup-name" placeholder="Как тебя зовут">
          </div>
          <div class="mb-3">
            <label class="form-label" for="signup-email">Email</label>
            <input type="email" class="form-control form-control-lg" id="signup-email" autocomplete="username">
          </div>
          <div class="mb-3">
            <label class="form-label" for="signup-password">Пароль (мин. 6)</label>
            <input type="password" class="form-control form-control-lg" id="signup-password" autocomplete="new-password">
          </div>
          <button class="btn btn-primary w-100 btn-lg" id="signup-submit">Создать аккаунт</button>
        </div>
      </div>
    </div>

    <div class="text-center text-muted mt-4">
      <small>Версия <span id="login-version">1.3.2</span></small>
    </div>
  </div>
</div>
